name: Vulnerability scan

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # New advisories are published independently of commits.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@7d2730e317c8366225b42fced34583b26440a9cc
        with:
          go-version-file: go.mod

      - name: Scan for known vulnerabilities
        run: go tool govulncheck ./...
